[project]
name = "amadeus-mcp-server"
version = "1.0.0"
description = "Open-source MCP server exposing the Amadeus Self-Service APIs (flight status, delay prediction, flight search, passenger rights) as tools for Claude and any MCP client."
authors = [{ name = "Thayná Barreiro", email = "thaynabarreiro@hotmail.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2",
    "disruption-agent @ git+https://github.com/Thaynabarreiro/amadeus-disruption-agent",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
amadeus-mcp-server = "amadeus_mcp_server.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
