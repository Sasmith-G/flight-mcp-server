Quickstart
1. Clone & Set Up Environment
Bash
git clone [https://github.com/Sasmith-G/flight-mcp-server](https://github.com/Sasmith-G/flight-mcp-server)
cd flight-mcp-server
python -m venv .venv
source .venv/bin/activate  # On Windows use: .venv\Scripts\activate
pip install -e .
2. Configure Environment Variables
Create a .env file in the root directory:

Code snippet
AMADEUS_CLIENT_ID=your_api_key_here
AMADEUS_CLIENT_SECRET=your_api_secret_here
ANTHROPIC_API_KEY=your_anthropic_key_here
Using with Claude Desktop
Add the server configuration to your claude_desktop_config.json file:

JSON
{
  "mcpServers": {
    "flight-mcp-server": {
      "command": "python",
      "args": [
        "-m",
        "amadeus_mcp_server.server"
      ],
      "env": {
        "AMADEUS_CLIENT_ID": "your_api_key_here",
        "AMADEUS_CLIENT_SECRET": "your_api_secret_here"
      }
    }
  }
}
